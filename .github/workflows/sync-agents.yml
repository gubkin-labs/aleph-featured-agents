name: Sync agents to Aleph

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Restore Aleph agent IDs
        uses: actions/cache@v4
        with:
          path: .aleph/state.json
          key: aleph-state-${{ github.run_id }}
          restore-keys: |
            aleph-state-

      - name: Sync agents
        env:
          ALEPH_API_KEY: ${{ secrets.ALEPH_API_KEY }}
          ALEPH_API_URL: ${{ secrets.ALEPH_API_URL }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
        run: pnpm run sync

      - name: Provision Aleph CMO repository token
        env:
          ALEPH_API_KEY: ${{ secrets.ALEPH_API_KEY }}
          ALEPH_REPOS_TOKEN: ${{ secrets.ALEPH_REPOS_TOKEN }}
        run: |
          set -euo pipefail
          entry_url="https://api.aleph-agent.com/me/vault/GH_TOKEN"
          description="GitHub token used by the private Aleph CMO agent to read Aleph repos and open blog-post pull requests"

          if curl --fail --silent --show-error \
            --header "x-api-key: ${ALEPH_API_KEY}" \
            "${entry_url}" >/dev/null; then
            curl --fail --silent --show-error \
              --request PATCH \
              --header "content-type: application/json" \
              --header "x-api-key: ${ALEPH_API_KEY}" \
              --data "$(jq --null-input --compact-output \
                --arg description "${description}" \
                --arg value "${ALEPH_REPOS_TOKEN}" \
                '{description: $description, value: $value}')" \
              "${entry_url}" >/dev/null
          else
            curl --fail --silent --show-error \
              --request POST \
              --header "content-type: application/json" \
              --header "x-api-key: ${ALEPH_API_KEY}" \
              --data "$(jq --null-input --compact-output \
                --arg description "${description}" \
                --arg name 'GH_TOKEN' \
                --arg value "${ALEPH_REPOS_TOKEN}" \
                '{description: $description, name: $name, value: $value}')" \
              "https://api.aleph-agent.com/me/vault" >/dev/null
          fi
