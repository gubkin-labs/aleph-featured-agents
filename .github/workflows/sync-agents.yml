name: Sync agents to Aleph

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: featured-agent-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Restore Aleph agent IDs
        id: aleph-state
        uses: actions/cache/restore@v4
        with:
          path: .aleph/state.json
          key: aleph-state-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            aleph-state-${{ github.ref_name }}-

      - name: Verify Aleph CMO identity
        run: |
          set -euo pipefail
          if ! jq -e '.agentId | type == "string" and length > 0' agents/aleph-cmo/aleph.json >/dev/null; then
            echo "Set agents/aleph-cmo/aleph.json agentId to the one canonical Aleph CMO agent ID before syncing." >&2
            exit 1
          fi

      - name: Sync agents
        env:
          ALEPH_API_KEY: ${{ secrets.ALEPH_API_KEY }}
          ALEPH_API_URL: ${{ secrets.ALEPH_API_URL }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
        run: pnpm run sync

      - name: Provision Aleph CMO repository token
        env:
          ALEPH_API_KEY: ${{ secrets.ALEPH_API_KEY }}
          ALEPH_API_URL: ${{ secrets.ALEPH_API_URL }}
          GH_TOKEN: ${{ secrets.ALEPH_REPOS_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "${GH_TOKEN}" \
            | pnpm dlx @gubkin-labs/aleph-cli@1.0.1 vault set GH_TOKEN \
              --value-stdin \
              --description "GitHub token used by the private Aleph CMO agent to read Aleph repos and open blog-post pull requests"

      - name: Save Aleph agent IDs
        if: always() && steps.aleph-state.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .aleph/state.json
          key: aleph-state-${{ github.ref_name }}-${{ github.run_id }}
