name: Sync agents to Aleph

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: featured-agent-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Restore Aleph agent IDs
        id: aleph-state
        uses: actions/cache/restore@v4
        with:
          path: .aleph/state.json
          key: aleph-state-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            aleph-state-${{ github.ref_name }}-

      # Version-gate failures: aleph agents pull (repo root) or agents pull agents/<name>
      # (downloads live bundle files + stamps versionId — do not edit versionId alone).
      - name: Verify agent identities
        env:
          ALEPH_API_KEY: ${{ secrets.ALEPH_API_KEY }}
          ALEPH_API_URL: ${{ secrets.ALEPH_API_URL }}
        run: |
          set -euo pipefail
          pnpm dlx @gubkin-labs/aleph-cli@latest agents sync agents --dry-run --no-enable

      - name: Sync agents
        env:
          ALEPH_API_KEY: ${{ secrets.ALEPH_API_KEY }}
          ALEPH_API_URL: ${{ secrets.ALEPH_API_URL }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
        run: pnpm run sync

      - name: Save Aleph agent IDs
        if: always() && steps.aleph-state.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .aleph/state.json
          key: aleph-state-${{ github.ref_name }}-${{ github.run_id }}
