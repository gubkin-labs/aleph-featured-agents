name: Sync agents to Aleph

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout Aleph CLI
        uses: actions/checkout@v4
        with:
          repository: gubkin-labs/aleph-cli
          path: .aleph-cli

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build Aleph CLI
        working-directory: .aleph-cli
        run: pnpm install --frozen-lockfile && pnpm build

      - name: Restore Aleph agent IDs
        uses: actions/cache@v4
        with:
          path: .aleph/state.json
          key: aleph-state-${{ github.run_id }}
          restore-keys: |
            aleph-state-

      - name: Sync agents
        env:
          ALEPH_API_KEY: ${{ secrets.ALEPH_API_KEY }}
          ALEPH_API_URL: ${{ secrets.ALEPH_API_URL }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
        run: node .aleph-cli/dist/cli.js agents sync agents --no-enable
