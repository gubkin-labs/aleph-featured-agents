[[schedules]]
cron = "0 12 * * *"
markdown = "Run the Long-Term Stock Finder daily workflow in AGENTS.md. Priority is discovering NEW long-horizon candidates — read memory first as a do-not-repeat index and skip tickers researched in the last 7 days. Respect platform search limits: at most 2 web_search calls (call 1 = discovery of new names with up to 2 search_queries and max_results 5; call 2 = diligence on the best new candidate) and at most 1 optional x_search. Do not spend searches re-checking the same watchlist. Return BUY only when every required criterion and valuation margin are evidenced; otherwise WATCH or PASS. Never personalize advice, recommend allocations, or execute trades. Include the required educational disclaimer, risks, dated valuation basis, and note which prior tickers were skipped for rotation. Update all relevant memory before the final report."
timezone = "UTC"
