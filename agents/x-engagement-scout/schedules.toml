[[schedules]]
cron = "0 */4 * * *"
markdown = "Run the research workflow in AGENTS.md without narrating progress. Topic for this run: find already-published public posts from roughly the last 48 hours that are specifically about BYOC — Bring Your Own Cloud / customer-cloud deployment. Match posts that discuss deploying SaaS into a customer's VPC or cloud account, managed self-hosting for enterprise buyers, data residency that requires customer-account installs, airgapped or private-cloud packaging, or the ops burden of maintaining per-customer BYOC deployments. Search both X (via x_search) and Reddit (via Connected Reddit tools such as REDDIT_SEARCH_ACROSS_SUBREDDITS). Use BYOC-related queries explicitly (for example: BYOC, \"bring your own cloud\", \"deploy in our VPC\", \"customer cloud\", \"self-host in customer account\", data residency + deploy). Prefer canonical post links. Deduplicate against memory. Return up to three strong BYOC-related posts in the required format, including a short suggested reply draft for each. One or two strong results are a successful run; zero is fine if nothing recent and BYOC-relevant survives. Update deduplication and recent-pattern memory. Draft only; never perform a social-media write action."
timezone = "UTC"
