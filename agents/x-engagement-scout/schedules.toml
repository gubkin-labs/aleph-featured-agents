[[schedules]]
cron = "0 */4 * * *"
markdown = "Run the X engagement scouting workflow in AGENTS.md without narrating progress. Initialize missing history memory before research. Find already-published public X posts from roughly the last 48 hours written by the target audience (SaaS/vendor operators hitting customer-cloud / self-host / data-residency deployment pain) — not competitors, landscape threads, or peer product launches. Use no more than five web_search calls total; prefer audience-pain queries over BYOC-category or named-competitor queries. Stop discovery early enough to finish, verify canonical public X post links, original context, and recency, then return the best one to three high-confidence reply opportunities in the required format. One or two strong results are a successful run; zero is fine if nothing recent and audience-relevant survives. Never keep searching merely to reach three. Update deduplication and recent-pattern memory. Draft only; never perform an X write action."
timezone = "UTC"
